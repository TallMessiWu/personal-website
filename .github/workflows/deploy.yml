name: 部署到云开发静态网站

on:
  push:
    branches:
      - master # 主分支推送时触发
  pull_request:
    branches:
      - master # PR时触发（可选）

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 拉取代码
      uses: actions/checkout@v4

    - name: 配置 Node.js 环境
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm' # 启用npm缓存加速构建

    - name: 安装项目依赖
      run: npm ci # 使用npm ci替代npm install，更适合CI环境

    - name: 构建生产版本
      run: npm run build

    - name: 安装 CloudBase CLI
      run: npm install -g @cloudbase/cli

    - name: 登录云开发环境
      uses: nick-fields/retry@v3
      with:
        timeout_minutes: 1
        max_attempts: 3
        retry_wait_seconds: 10
        command: tcb login --apiKeyId ${{ secrets.TCB_SECRET_ID }} --apiKey ${{ secrets.TCB_SECRET_KEY }}

    - name: 清理云端旧文件
      uses: nick-fields/retry@v3
      with:
        timeout_minutes: 1
        max_attempts: 3
        retry_wait_seconds: 10
        command: tcb hosting delete / -e ${{ secrets.TCB_ENV_ID }} -d || true

    - name: 部署至云开发静态托管
      uses: nick-fields/retry@v3
      with:
        timeout_minutes: 5
        max_attempts: 3
        retry_wait_seconds: 10
        command: tcb hosting deploy ./dist / -e ${{ secrets.TCB_ENV_ID }}